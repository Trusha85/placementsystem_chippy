{% if form.non_field_errors %}<div class="msg error">{{ form.non_field_errors }}</div>{% endif %}
{% for f in form %}
<div class="frow"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
{% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}
{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>
{% endfor %}
